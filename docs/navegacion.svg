<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="navTitle navDesc">
  <title id="navTitle">Flujo de navegación de Racks Tracker</title>
  <desc id="navDesc">Desde el Login se accede a Racks, Crear cuenta o Recuperar contraseña. Desde Racks se navega a Agregar rack, Detalle del rack o Perfil, y desde Perfil se cierra sesión y se vuelve al Login.</desc>

  <defs>
    <marker id="navArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60E8C0"/>
    </marker>
    <marker id="navArrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A8C73"/>
    </marker>
  </defs>

  <rect width="960" height="440" rx="20" fill="#0B1116"/>
  <rect x="0.5" y="0.5" width="959" height="439" rx="19.5" fill="none" stroke="#1F3038"/>

  <text x="48" y="54" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#E8F0F8">Flujo de navegación</text>
  <text x="48" y="80" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#98A8B8">Recorrido principal entre las pantallas de la aplicación</text>

  <rect x="90" y="190" width="150" height="56" rx="14" fill="#10251F" stroke="#2A8C73"/>
  <text x="165" y="223" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E8F0F8">Login</text>

  <rect x="560" y="190" width="150" height="56" rx="14" fill="#10251F" stroke="#2A8C73"/>
  <text x="635" y="223" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E8F0F8">Racks</text>

  <rect x="780" y="190" width="150" height="56" rx="14" fill="#0E141B" stroke="#1F3038"/>
  <text x="855" y="223" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#E8F0F8">Detalle del rack</text>

  <rect x="300" y="100" width="180" height="50" rx="13" fill="#0E141B" stroke="#1F3038"/>
  <text x="390" y="130" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8F0F8">Crear cuenta</text>

  <rect x="300" y="280" width="190" height="50" rx="13" fill="#0E141B" stroke="#1F3038"/>
  <text x="395" y="310" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8F0F8">Recuperar contraseña</text>

  <rect x="780" y="90" width="150" height="50" rx="13" fill="#0E141B" stroke="#1F3038"/>
  <text x="855" y="120" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8F0F8">Agregar rack</text>

  <rect x="780" y="285" width="150" height="50" rx="13" fill="#0E141B" stroke="#1F3038"/>
  <text x="855" y="315" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8F0F8">Perfil</text>

  <line x1="240" y1="218" x2="552" y2="218" stroke="#60E8C0" stroke-opacity="0.75" stroke-width="1.6" marker-end="url(#navArrow)"/>
  <text x="396" y="208" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#607080">sesión iniciada</text>

  <path d="M205 205 C250 205 250 140 300 136" fill="none" stroke="#2A8C73" stroke-width="1.5" marker-end="url(#navArrowMuted)"/>
  <text x="226" y="168" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#607080">registro</text>

  <path d="M205 231 C250 231 250 296 300 302" fill="none" stroke="#2A8C73" stroke-width="1.5" marker-end="url(#navArrowMuted)"/>
  <text x="226" y="278" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#607080">recuperar</text>

  <path d="M480 136 C520 136 520 190 552 198" fill="none" stroke="#2A8C73" stroke-width="1.5" marker-end="url(#navArrowMuted)"/>
  <text x="524" y="162" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#607080">alta</text>

  <path d="M685 200 C730 200 730 130 780 122" fill="none" stroke="#2A8C73" stroke-width="1.5" marker-end="url(#navArrowMuted)"/>
  <text x="738" y="158" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#607080">nuevo rack</text>

  <line x1="710" y1="218" x2="772" y2="218" stroke="#2A8C73" stroke-width="1.5" marker-end="url(#navArrowMuted)"/>

  <path d="M685 236 C730 236 730 300 780 308" fill="none" stroke="#2A8C73" stroke-width="1.5" marker-end="url(#navArrowMuted)"/>
  <text x="745" y="280" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#607080">perfil</text>

  <path d="M780 318 C780 392 165 392 165 254" fill="none" stroke="#2A8C73" stroke-width="1.5" marker-end="url(#navArrowMuted)"/>
  <text x="430" y="384" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#607080">cerrar sesión</text>

  <text x="48" y="416" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#607080">Al cerrar sesión se limpia la sesión persistida y se regresa al Login.</text>
</svg>
